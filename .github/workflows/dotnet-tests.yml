
name: .NET Unit Tests

on:
  push:
    branches:
      - feature/add-tests
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CarSimulatorApp.sln

      - name: Build solution
        run: dotnet build CarSimulatorApp.sln --no-restore

      - name: Run unit tests
        run: dotnet test DataLogicLibrary.Tests/DataLogicLibrary.Tests.csproj --no-build
