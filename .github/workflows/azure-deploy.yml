
name: Build, Test and Deploy CarSimulator to Azure

on:
  push:
    branches:
      - feature/github-actions-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CarSimulatorApp.sln

      - name: Build solution
        run: dotnet build CarSimulatorApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test DataLogicLibrary.Tests/DataLogicLibrary.Tests.csproj --configuration Release --no-build

      - name: Publish web application
        run: dotnet publish CarSimulator.Server/CarSimulator.Server.csproj --configuration Release --no-build --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsimulator-webapp
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build-and-test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: carsimulator-webapp
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4E917D520DF34FAE9D6C7644BB962719 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D3B2289ACFEE44CE87799C53AAC1FEFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C95FD4925B2F4AF28E4B5CD256529CED }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mehwish-carsimulator
          slot-name: Production
          package: ./publish
